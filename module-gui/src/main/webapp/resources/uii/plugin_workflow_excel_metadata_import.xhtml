<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:p="http://primefaces.org/ui"
    xmlns:button="http://goobi.io/button"
    xmlns:section="http://goobi.io/section">
    <h:panelGroup>
        <div class="row">
            <div class="col-sm-12">
                <h:panelGroup
                    rendered="#{!LoginForm.hasRole('Plugin_workflow_excel_metadata_import')}"
                    styleClass="color-box bg-hot text-white d-flex flex-row p-3">
                    <h:outputText
                        styleClass="fw-bold"
                        value="#{msgs.plugin_administration_missingPermission} Plugin_workflow_excel_metadata_import" />
                </h:panelGroup>

                <ui:fragment rendered="#{LoginForm.hasRole('Plugin_workflow_excel_metadata_import')}">
                    <section:section
                        type="neutral"
                        id="section">
                        <h:form
                            id="uploadForm"
                            enctype="multipart/form-data">
                            <section:header
                                icon="plug"
                                title="#{msgs[NavigationForm.workflowPlugin.title]}" />
                            <section:body
                                padding="true"
                                id="section-body">
                                <div class="row">
                                    <div class="col-sm-6">
                                        <p:fileUpload
                                            listener="#{NavigationForm.workflowPlugin.uploadFile}"
                                            id="excelUpload"
                                            auto="true"
                                            mode="advanced"
                                            dragDropSupport="true"
                                            label="#{msgs.plugin_massupload_selectFiles}"
                                            update="section:uploadForm tableSection:tableForm"
                                            styleClass="ms-auto">
                                            <p:validateFile
                                                sizeLimit="1000000000000"
                                                allowTypes="/(\.|\/)(xlsx?|ods)$/" />
                                        </p:fileUpload>
                                    </div>
                                    <div class="col-sm-6">
                                        <h:panelGroup
                                            id="uploadedFileInfo"
                                            layout="block">
                                            <ui:fragment rendered="#{NavigationForm.workflowPlugin.excelFile != null}">
                                                <div class="alert alert-success">
                                                    <span class="fa fa-file-excel-o me-2" />
                                                    <h:outputText value="#{NavigationForm.workflowPlugin.excelFile.fileName}" />
                                                </div>
                                            </ui:fragment>
                                        </h:panelGroup>
                                    </div>
                                </div>
                            </section:body>
                            <section:footer>
                                <button:row>
                                    <h:commandButton
                                        rendered="#{NavigationForm.workflowPlugin.excelFile != null}"
                                        styleClass="btn btn-blank"
                                        value="#{msgs.abbrechen}"
                                        action="#{NavigationForm.workflowPlugin.cancelUpload()}">
                                        <f:ajax
                                            execute="@this"
                                            render="section:uploadForm section:uploadForm:uploadedFileInfo tableSection:tableForm" />
                                    </h:commandButton>
                                </button:row>
                            </section:footer>
                        </h:form>
                    </section:section>



                    <section:section
                        type="neutral"
                        id="tableSection">
                        <h:form
                            id="tableForm"
                            enctype="multipart/form-data">
                            <section:header
                                icon="plug"
                                title="#{msgs[NavigationForm.workflowPlugin.title]}" />
                            <section:body
                                padding="true"
                                id="section-body">
                                <div class="row">
                                    <div class="col-sm-12">
                                        <h:dataTable
                                            id="headerAssignment"
                                            rendered="#{NavigationForm.workflowPlugin.headerOrder.size() gt 0}"
                                            styleClass="table table-hover table-nomargin dataTable table-bordered table-border-right responsive"
                                            var="column"
                                            value="#{NavigationForm.workflowPlugin.headerOrder}">

                                            <h:column>
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.vocabularyManager_excelImport_columnName}" />
                                                </f:facet>
                                                <h:outputText value="#{column.columnHeader}" />
                                            </h:column>
                                            <h:column>
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.vocabularyManager_excelImport_columnLetter}" />
                                                </f:facet>
                                                <h:outputText value="#{column.columnLetter}" />
                                            </h:column>

                                            <h:column>
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.vocabularyManager_excelImport_vocabularyField}" />
                                                </f:facet>
                                                <h:selectOneMenu
                                                    styleClass="form-control"
                                                    value="#{column.assignedField}">
                                                    <f:selectItems value="#{NavigationForm.workflowPlugin.metadataFields}" />
                                                    <f:ajax
                                                        execute="@this"
                                                        render=":headerAssignment" />
                                                </h:selectOneMenu>
                                            </h:column>
                                        </h:dataTable>
                                    </div>
                                </div>
                            </section:body>
                        </h:form>

                    </section:section>
                </ui:fragment>
            </div>
        </div>
    </h:panelGroup>
</ui:composition>
